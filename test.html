<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/wdd130/semana05/estilos/formulario-pesquisa.css"
    />
    <title>Document</title>
  </head>
  <h1>WDD 130 | Formulário HTML - Enquete do usuário</h1>
  <body>
    <header>
      <main>
        <form>
          <fieldset>Informações de Contato</fieldset>
          <label for="nomecompleto">Nome completo do usuário:"</label>
          <input type="text" id="nomecompleto" name="nome-completo" required />
          <label for="emaildousuario"> E-mail:</label>
          <input type="email" id="nome-do-usuario" name="email-do-usuario" />

          <label for="quantidade">Selecione a Quantidade</label>
          <select name="qiantidade" id="quantidade">
            <option value="1">Um</option>
            <option value="2">Dois</option>
            <option value="3">Três</option>
          </select>

          <fieldset>Perguntas</fieldset>
          <label for="navegadorfavorito">Qual o Seu Navegador Favorito?</label>
          <select type="text" name="navegador" id="naveador">
            <option value="chrome">Chrome</option>
            <option value="edge">Edge</option>
            <option value="safari">Saari</option>
            <option value="opera">Opera</option>
            <option value="brave">Brave</option>
          </select>

          <label for="pet">Você tem um animal de estimação?</label>
          <input type="checkbox" id="pet" name="pet" />
          <label for="lugaresquemorou">Liste os lugres que você morou: </label>
          <textarea
            name="lugaresquemorou"
            id="lugaresquemorou"
            rows="4"
            placeholder="Multiplos Brazil, Dublin Irelan, Lisbon Portugal."
          ></textarea>

          <button type="submit">Enviar Pesquisa</button>
        </form>
      </main>
    </header>
    <body></body>
    <footer>
      <p class="footer-texxt">
        &copy; 2026 | Formulário HTML - Atividade de Pesquisa de Usuário |
        Eduardo Veras
      </p>
    </footer>
  </body>
</html>
