<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/wdd130/semana05/estilos/formulario-pesquisa.css"
    />
    <title>Formulário de Pesquisa</title>
  </head>
  <body>
    <header>
      <h1>WDD 130 | Formulário HTML – Pesquisa de Usuário</h1>
    </header>

    <main>
      <form>
        <!-- PRIMEIRO FIELDSET -->
        <fieldset>
          <legend>Informações de Contato</legend>

          <div class="campo">
            <label for="nomecompleto">Nome Completo:</label>
            <input
              type="text"
              id="nomecompleto"
              name="nome-completo"
              required
            />
          </div>

          <div class="campo">
            <label for="emaildousuario">E-mail:</label>
            <input type="email" id="emaildousuario" name="email-do-usuario" />
          </div>
        </fieldset>

        <!-- SEGUNDO FIELDSET -->
        <fieldset>
          <legend>Perguntas</legend>

          <div class="campo">
            <label for="navegadorfavorito"
              >Qual é o seu navegador favorito?</label
            >
            <select name="navegador" id="navegadorfavorito">
              <option value="chrome">Chrome</option>
              <option value="edge">Edge</option>
              <option value="safari">Safari</option>
              <option value="opera">Opera</option>
              <option value="brave">Brave</option>
            </select>
          </div>

          <!-- CHECKBOX ALINHADO LADO A LADO -->
          <div class="campo-inline">
            <label for="pet">Você tem um animal de estimação?</label>
            <input type="checkbox" id="pet" name="pet" />
          </div>

          <div class="campo-textarea">
            <label for="lugaresquemorou"
              >Liste os lugares onde você morou:</label
            >
            <textarea
              name="lugaresquemorou"
              id="lugaresquemorou"
              rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"
            ></textarea>
          </div>
        </fieldset>

        <button type="submit">Enviar Pesquisa</button>
      </form>
    </main>

    <footer>
      <p class="footer-text">
        &copy; 2026 | Formulário HTML - Atividade de Pesquisa de Usuário |
        Eduardo Veras
      </p>
    </footer>
  </body>
</html>
